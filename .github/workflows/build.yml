name: Build Monee
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Read and verify version
        shell: bash
        run: |
          version=$(sed -n 's/^moneeVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "MONEE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test Go
        run: |
          go -C server test -race ./...
          go -C server vet ./...
      - name: Test client and build Web
        run: ./gradlew --no-daemon :shared:jvmTest :webApp:wasmJsBrowserDistribution
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon :desktopApp:createDistributable :desktopApp:packageDmg
      - name: Package application and local service
        shell: bash
        env:
          MONEE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: monee-${{ env.MONEE_VERSION }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Monee $GITHUB_REF_NAME" --notes-file docs/releases/0.0.1.md
