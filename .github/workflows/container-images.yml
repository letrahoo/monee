name: Build deployment images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            image: monee-api
          - name: web
            dockerfile: Dockerfile.web
            image: monee-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Smoke-test image
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_KIND: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          container="monee-${IMAGE_KIND}-smoke"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          if [[ "$IMAGE_KIND" == api ]]; then
            docker run --detach --rm --name "$container" \
              --publish 127.0.0.1:4173:4173 \
              --env MONEE_PUBLIC_URL=https://monee.test \
              "$IMAGE" -listen 0.0.0.0:4173 -data-dir /tmp/monee
            for attempt in {1..30}; do
              if curl --fail --silent --show-error -H 'Host: monee.test' \
                http://127.0.0.1:4173/api/v1/health >/dev/null; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                docker logs "$container"
                exit 1
              fi
              sleep 1
            done
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Host: monee.test' -H 'Origin: http://monee.test' \
              http://127.0.0.1:4173/api/v1/health)" = 403
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Host: monee.test' -H 'Origin: https://monee.test' \
              http://127.0.0.1:4173/api/v1/dashboard)" = 401
          else
            docker run --detach --rm --name "$container" \
              --publish 127.0.0.1:8080:8080 "$IMAGE"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error \
                http://127.0.0.1:8080/index.html >/dev/null; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                docker logs "$container"
                exit 1
              fi
              sleep 1
            done
            curl --fail --silent --show-error --head \
              http://127.0.0.1:8080/index.html | grep -qi '^strict-transport-security:'
          fi
