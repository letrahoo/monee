# Docker replaces service IPs when containers are recreated. Resolve through
# its embedded DNS so API recovery does not require restarting the Web service.
log_format monee_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream monee_api {
    zone monee_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server api:4173 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;
    # Do not log OAuth query parameters or a Referer containing them.
    access_log /var/log/nginx/access.log monee_safe;

    location /api/ {
        # Search terms are private financial data; upstream errors include URLs.
        # Diagnose failures with the sanitized access status and Go logs.
        error_log /dev/null;
        proxy_pass http://monee_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /auth/ {
        # Nginx's error format includes the full request and cannot be redacted.
        # Keep path/status in the safe access log for callback troubleshooting.
        error_log /dev/null;
        proxy_pass http://monee_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
}
