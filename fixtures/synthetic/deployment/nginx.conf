log_format monee_test_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name monee.test;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    access_log /var/log/nginx/access.log monee_test_safe;
    # Test edge logs have the same privacy requirement as the application proxy.
    error_log /dev/null;
    location / {
        proxy_pass http://monee-web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
