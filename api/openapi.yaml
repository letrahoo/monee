---
openapi: 3.1.0
info:
  title: Monee Local Ledger API
  version: 1.5.0
  description: Unified product users with explicitly linked Google/GitHub identities.
    System admission is separate from ledger ownership/editor/viewer memberships.
    All data access is enforced by Go. Feishu is reserved for a future provider adapter.
    Local loopback HTTP only; cloud deployment is not yet supported. Cookie-authenticated
    writes require X-Monee-CSRF. Application database schema version 2.
servers:
- url: http://127.0.0.1:4173
security:
- localBearer: []
- browserSession: []
paths:
  "/api/v1/health":
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - apiVersion
                - schemaVersion
                properties:
                  status:
                    type: string
                    const: ok
                  apiVersion:
                    type: integer
                    const: 1
                  schemaVersion:
                    type: integer
                    const: 2
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/dashboard":
    get:
      operationId: dashboard
      description: Statistics cover the entire month. Search and page only filter
        the transaction list.
      parameters:
      - in: query
        name: month
        description: YYYY-MM between 1900 and 2200; empty or omitted selects this
          month in Asia/Shanghai.
        schema:
          type: string
      - in: query
        name: q
        description: Case-insensitive literal substring of merchant, category, source,
          account or note.
        schema:
          type: string
          maxLength: 100
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - in: header
        name: X-Monee-Ledger
        required: false
        description: Explicit target ledger ID. Clients always send this. Omission
          is accepted only when the user belongs to exactly one ledger; otherwise
          ledger_required. Membership is checked for each operation.
        schema:
          type: string
      responses:
        '200':
          description: Monthly aggregates and at most 50 transactions, sorted by date
            and creation time descending, then ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Dashboard"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/transactions":
    post:
      operationId: createTransaction
      description: Same key and normalized input return the same transaction, including
        after a lost response. Changing the input under that key returns 409.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
      - in: header
        name: X-Monee-Ledger
        required: false
        description: Explicit target ledger ID. Clients always send this. Omission
          is accepted only when the user belongs to exactly one ledger; otherwise
          ledger_required. Membership is checked for each operation.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionInput"
      responses:
        '201':
          description: Persisted transaction (also returned for an idempotent replay).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/imports":
    get:
      operationId: listImports
      description: Saved previews and committed batches in the selected ledger. Readable by ledger viewers. Invalid files rejected before saving do not appear here.
      parameters:
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
        description: Explicit ledger selection; omission allowed only for a single membership.
      - in: query
        name: page
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '200':
          description: Newest first, with deterministic ID ordering for equal timestamps. Pages past the end return an empty list.
          content:
            application/json:
              schema:
                type: object
                required: [imports, page, pageSize, totalCount]
                properties:
                  imports:
                    type: array
                    maxItems: 50
                    items: {$ref: '#/components/schemas/ImportSummary'}
                  page: {type: integer}
                  pageSize: {type: integer, const: 50}
                  totalCount: {type: integer, minimum: 0}
        default:
          $ref: '#/components/responses/Error'
  "/api/v1/imports/{id}":
    get:
      operationId: getImport
      description: Saved preview and committed normalized source evidence. Does not expose the raw file. An ID from another ledger returns 404.
      parameters:
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
        description: Explicit ledger selection; membership is verified on every request.
      - in: path
        name: id
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Import details. Evidence is empty until committed. Stored normalized records are import-time snapshots, not current edited transactions.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ImportSummary'
                - type: object
                  required: [preview, evidence]
                  properties:
                    preview: {$ref: '#/components/schemas/ImportPreview'}
                    evidence:
                      type: array
                      maxItems: 1000
                      items:
                        type: object
                        required: [id, line, transactionId, disposition, record]
                        properties:
                          id: {type: string}
                          line: {type: integer, minimum: 2}
                          transactionId: {type: string}
                          disposition: {type: string, enum: [added, duplicate]}
                          record: {$ref: '#/components/schemas/Transaction'}
        default:
          $ref: '#/components/responses/Error'
  "/api/v1/imports/alipay/preview":
    post:
      operationId: previewAlipayImport
      description: |
        Native Alipay CSV bytes, UTF-8/BOM or GB18030, at most 2 MiB / 1000 records.
        Stable source account alias is required. Ordinary successful expenses in a conservative
        category allowlist and salary income are normalized by Go. Refunds, transfers,
        unknown states/categories, missing payment traces and invalid money enter pending.
        Same-merchant originals in a document containing refunds also enter pending.
        Pending rows do not affect balances and cannot be committed as transactions.
        Native previews retain pending/source evidence and an original-byte envelope.
        Malformed/conflicting previews also persist as failed batches and must not be committed.
        Source aliases must remain stable. Cross-source matching with legacy migration is not automatic.
      parameters:
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
        description: Target ledger; write membership required.
      - in: header
        name: X-Monee-CSRF
        schema: {type: string}
        description: Required with browser cookie authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, contentBase64, account]
              properties:
                filename: {type: string, maxLength: 200}
                contentBase64: {type: string, format: byte, maxLength: 2796204}
                account: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Preview separates bookable rows, pending source rows and structural errors.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreview'}
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/imports/wechat/preview":
    post:
      operationId: previewWeChatImport
      description: |
        Single-sheet original WeChat XLSX, 2 MiB compressed / 20 MiB expanded / 1000 records.
        Exact XML decimal strings and typed source identifiers are retained. Formulas,
        numeric order identifiers, malformed archives and multiple sheets are rejected.
        Only successful merchant consumption is bookable; refunds, transfers, income and
        uncertain records remain pending. Native failed previews are retained, never committed.
      parameters:
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
        description: Target ledger; write membership required.
      - in: header
        name: X-Monee-CSRF
        schema: {type: string}
        description: Required with browser cookie authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, contentBase64, account]
              properties:
                filename: {type: string, maxLength: 200}
                contentBase64: {type: string, format: byte, maxLength: 2796204}
                account: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Preview separates bookable rows, pending source rows and structural errors.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreview'}
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/imports/preview":
    post:
      operationId: previewImport
      description: |
        Standard UTF-8 CSV, optional BOM, at most 2 MiB and 1000 records.
        Required columns are date,type,amount,currency,merchant,source.
        Optional columns are category,account,external_id,note.
        Structural or row errors are returned in errors with HTTP 200; do not commit such a result.
        Batches without validation/identity conflicts and their raw CSV are persisted.
        Transactions are not created by preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - csv
              properties:
                filename:
                  type: string
                  description: Basename is retained; at most 200 characters after
                    basename extraction.
                csv:
                  type: string
      responses:
        '200':
          description: Preview with errors, duplicate/similar status or alreadyCommitted
            indication.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportPreview"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
      - in: header
        name: X-Monee-Ledger
        required: false
        description: Explicit target ledger ID. Clients always send this. Omission
          is accepted only when the user belongs to exactly one ledger; otherwise
          ledger_required. Membership is checked for each operation.
        schema:
          type: string
  "/api/v1/imports/{id}/commit":
    post:
      operationId: commitImport
      description: |
        Commit bookable preview rows atomically. Native pending rows remain as evidence and are never inserted.
        Review-only batches cannot be committed. Ledger changes since preview cause 409.
        Similar records require confirmSimilar=true, acknowledging they are independent transactions.
        This does not merge cross-source records. Already committed batches return the original result.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
      - in: header
        name: X-Monee-Ledger
        required: false
        description: Explicit target ledger ID. Clients always send this. Omission
          is accepted only when the user belongs to exactly one ledger; otherwise
          ledger_required. Membership is checked for each operation.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ledgerVersion:
                  type: integer
                  format: int64
                  default: 0
                confirmSimilar:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Original commit result; added/skipped are counts for that batch,
            not this HTTP request.
          content:
            application/json:
              schema:
                type: object
                required:
                - importId
                - added
                - skipped
                - month
                properties:
                  importId:
                    type: string
                    format: uuid
                  added:
                    type: integer
                    minimum: 0
                  skipped:
                    type: integer
                    minimum: 0
                  pending:
                  type: integer
                  minimum: 0
                  description: Native rows retained for review, not booked.
                month:
                    type: string
                    description: Latest business month in this batch.
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/template":
    get:
      operationId: csvTemplate
      parameters:
      - in: query
        name: sample
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Standard CSV header, with three synthetic records when sample=true.
          content:
            text/csv:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/auth/me":
    get:
      operationId: authState
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthState"
        default:
          "$ref": "#/components/responses/Error"
      security: []
  "/api/v1/auth/start":
    post:
      operationId: startLogin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    const: 600
                required:
                - id
                - url
                - expiresIn
        default:
          "$ref": "#/components/responses/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - google
                  - github
                client:
                  type: string
                  enum:
                  - web
                  - desktop
                challenge:
                  type: string
                  description: 'Required for desktop: base64url SHA-256 of a random
                    32-byte base64url verifier. Empty for web.'
                intent:
                  type: string
                  enum:
                  - login
                  - link
                  default: login
                  description: link requires an admitted initiating session (and cookie
                    CSRF), and verifies an additional identity without switching the
                    current account.
              required:
              - provider
              - client
              additionalProperties: false
      description: Creates a bounded, 10-minute login attempt. Returns 503 when this
        provider is not configured. Navigate the browser to the returned URL; no application
        session is returned here. Binding an already registered identity creates a
        pending merge that must be explicitly confirmed by the initiating session.
  "/api/v1/auth/native/poll":
    post:
      operationId: nativeLoginResult
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - complete
                    - failed
                    - linked
                    - merge_required
                  token:
                    type: string
                    description: Opaque application session only on the single successful
                      redemption. Never put it in a URL.
                required:
                - status
                - token
        default:
          "$ref": "#/components/responses/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                verifier:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{43}$"
              required:
              - id
              - verifier
              additionalProperties: false
      description: Proof-bound native exchange. Poll at 2-second intervals. Expired,
        mismatched or already redeemed attempts return 401. A lost successful response
        requires starting a new login.
  "/api/v1/auth/logout":
    post:
      operationId: logout
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                - ok
        default:
          "$ref": "#/components/responses/Error"
      security: []
      description: Revokes the current session. Cookie-authenticated callers must
        supply X-Monee-CSRF. An already absent session is also successful.
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
  "/api/v1/admin/allowlist":
    get:
      operationId: listAllowlist
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AccessEntry"
                required:
                - entries
        default:
          "$ref": "#/components/responses/Error"
      description: Superadmin only. Includes enabled/disabled members and protected
        bootstrap administrators.
    post:
      operationId: addAllowlistMember
      responses:
        default:
          "$ref": "#/components/responses/Error"
        '201':
          description: 成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccessEntry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccessSelector"
      description: Superadmin only. Creates an ordinary member. Duplicate identity
        returns 409. GitHub username lookup failure does not grant access.
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
  "/api/v1/admin/allowlist/{id}":
    patch:
      operationId: changeAllowlistAccess
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccessEntry"
        default:
          "$ref": "#/components/responses/Error"
      description: Superadmin only. Protected administrators cannot be changed. Version
        conflicts return 409. Disabling blocks subsequent data requests, including
        existing sessions.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required when authenticating this write with a browser cookie;
          use the proof from auth/me. Not required for native Bearer sessions.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                version:
                  type: integer
                  format: int64
              required:
              - enabled
              - version
              additionalProperties: false
  "/api/v1/admin/audit":
    get:
      operationId: accessAudit
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/AccessAudit"
                required:
                - events
        default:
          "$ref": "#/components/responses/Error"
      description: Superadmin only. Latest 100 access changes, newest first.
  "/auth/begin":
    get:
      operationId: beginBrowserLogin
      security: []
      parameters:
      - in: query
        name: ticket
        required: true
        schema:
          type: string
      responses:
        '303':
          description: Browser redirect. Invalid, expired or cancelled attempts redirect
            to a fixed result page, never an arbitrary return URL.
          headers:
            Location:
              schema:
                type: string
  "/auth/callback/{provider}":
    get:
      operationId: oauthCallback
      security: []
      description: Requires the original browser binding cookie and one-time state;
        exchanges code with PKCE and verifies the provider identity. Only GET callbacks
        are supported.
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      - in: query
        name: state
        required: true
        schema:
          type: string
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      responses:
        '303':
          description: Browser redirect. Invalid, expired or cancelled attempts redirect
            to a fixed result page, never an arbitrary return URL.
          headers:
            Location:
              schema:
                type: string
  "/auth/result":
    get:
      operationId: loginResultPage
      security: []
      responses:
        '200':
          description: Fixed login outcome page containing no authorization code or
            session token. Desktop success offers a fixed monee://auth/complete wake
            link. The desktop requests foreground after proof-bound session redemption;
            the link only activates its window and never grants access.
          content:
            text/html:
              schema:
                type: string
  "/api/v1/ledgers":
    get:
      operationId: listLedgers
      description: Only ledgers the admitted user belongs to. Platform superadmin
        has no implicit ledger access.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledgers:
                    type: array
                    items:
                      "$ref": "#/components/schemas/LedgerInfo"
                required:
                - ledgers
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
    post:
      operationId: createLedger
      description: Creates a CNY ledger and owner membership atomically.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LedgerInfo"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
              - name
              additionalProperties: false
  "/api/v1/ledgers/{ledger}/members":
    get:
      operationId: ledgerMembers
      description: Owner only.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      "$ref": "#/components/schemas/LedgerMember"
                required:
                - members
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: path
        name: ledger
        required: true
        schema:
          type: string
  "/api/v1/ledgers/{ledger}/invitations":
    post:
      operationId: inviteLedgerMember
      description: Owner invites an admitted product user by UUID. Pending invitations
        grant no access.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: path
        name: ledger
        required: true
        schema:
          type: string
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                role:
                  type: string
                  enum:
                  - editor
                  - viewer
              required:
              - userId
              - role
              additionalProperties: false
  "/api/v1/ledgers/{ledger}/members/{user}":
    patch:
      operationId: changeLedgerMember
      description: Owner only. Version check prevents stale changes; owner cannot
        be removed or downgraded.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: path
        name: ledger
        required: true
        schema:
          type: string
      - in: path
        name: user
        required: true
        schema:
          type: string
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                  - editor
                  - viewer
                  - remove
                version:
                  type: integer
              required:
              - role
              - version
              additionalProperties: false
  "/api/v1/invitations":
    get:
      operationId: listInvitations
      description: Only pending invitations addressed to the authenticated user.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      "$ref": "#/components/schemas/LedgerInvitation"
                required:
                - invitations
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/invitations/{id}/respond":
    post:
      operationId: respondInvitation
      description: Recipient only. Accept grants membership; decline does not. Replays
        fail. Both are audited.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accept:
                  type: boolean
              required:
              - accept
              additionalProperties: false
  "/api/v1/auth/account":
    get:
      operationId: accountDetails
      description: Current product user, linked identities and unexpired pending merges.
        Requires login.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/AuthUser"
                  identities:
                    type: array
                    items:
                      "$ref": "#/components/schemas/LinkedIdentity"
                  pendingMerges:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PendingMerge"
                required:
                - user
                - identities
                - pendingMerges
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
    patch:
      operationId: renameAccount
      description: Updates the current account display name.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
              - name
              additionalProperties: false
  "/api/v1/auth/account/unlink":
    post:
      operationId: unlinkIdentity
      description: Unlinks an owned identity and revokes its sessions. The final login
        and protected bootstrap identities cannot be removed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                subject:
                  type: string
              required:
              - provider
              - subject
              additionalProperties: false
  "/api/v1/auth/account/merge":
    post:
      operationId: confirmAccountMerge
      description: Consumes a completed OAuth binding proof belonging to the same
        initiating live session. Preserves both accounts ledger memberships, takes
        the higher role for overlaps, revokes source account sessions, and keeps historical
        actor IDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
              - id
              additionalProperties: false
  "/api/v1/admin/users":
    get:
      operationId: listRegisteredUsers
      description: Superadmin only. Unified product accounts, not provider identities.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      "$ref": "#/components/schemas/RegisteredUser"
                required:
                - users
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/admin/users/{id}":
    patch:
      operationId: setUserAdmission
      description: Superadmin only, optimistic version check. Disabling applies to
        all linked channels; bootstrap superadmins are protected. Does not grant ledger
        membership.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Monee-CSRF
        required: false
        description: Required for cookie-authenticated writes; obtain from auth/me.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                version:
                  type: integer
              required:
              - enabled
              - version
              additionalProperties: false
  "/api/v1/transactions/{id}/annotation":
    patch:
      operationId: annotateTransaction
      description: Writer only. Update category and note using optimistic transaction version. Preserves immutable source fingerprint, postings balance, and revision history.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      - in: header
        name: X-Monee-CSRF
        description: Required for cookie-authenticated writes.
        schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, category, note]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                category: {type: string, maxLength: 200}
                note: {type: string, maxLength: 1000}
  "/api/v1/transactions/{id}/annotations":
    get:
      operationId: transactionAnnotations
      description: Members can read the latest 100 revisions, newest first.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/AnnotationRevision'}
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/transactions/{id}/sources":
    get:
      operationId: transactionSources
      description: Members can read up to 100 linked source occurrences in import batches.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/TransactionSource'}
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/transactions/{id}/correction/preview":
    post:
      operationId: previewCorrection
      description: Writer-only read-only preview. Computes impact on monthly income, expense and net without changing the ledger.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      - in: header
        name: X-Monee-CSRF
        description: Required for cookie-authenticated POST/PATCH requests, including previews.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectionInput'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionPreview'
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/transactions/{id}/correction":
    patch:
      operationId: correctTransaction
      description: Writer-only correction of ordinary income/expense. Revalidates version and recalculates postings; preserves source fingerprint and full before/after history.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      - in: header
        name: X-Monee-CSRF
        description: Required for cookie-authenticated POST/PATCH requests, including previews.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectionInput'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default: {$ref: '#/components/responses/Error'}
  "/api/v1/transactions/{id}/corrections":
    get:
      operationId: correctionHistory
      description: Members can read correction history, newest first, up to 100 records.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: header
        name: X-Monee-Ledger
        schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/CorrectionRevision'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      description: Opaque 12-hour application session obtained only by the native
        proof-bound OAuth exchange. The connection file contains no token.
    browserSession:
      type: apiKey
      in: cookie
      name: monee_session_eLaGr4oiqzKw
      description: HttpOnly SameSite=Lax session. The cookie name uses an origin hash;
        this name is for the default origin. Follow Set-Cookie when using a different
        port.
  responses:
    Error:
      description: 400 malformed JSON; 401 absent/expired session or invalid native
        proof; 403 data access denied, admin role required, CSRF or origin rejected;
        404 unknown resource; 409 identity/version conflict; 415 non-JSON write; 422
        validation; 429 too many login attempts; 503 provider unconfigured; 500 internal
        failure. Unknown routes may use plain-text 404/405.
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
  schemas:
    Minor:
      type: string
      pattern: "^-?[0-9]+$"
      description: Signed 64-bit integer fen as a decimal string. Never a JSON number.
    TransactionInput:
      type: object
      additionalProperties: false
      required:
      - date
      - type
      - amount
      - currency
      - merchant
      - source
      properties:
        date:
          type: string
          format: date
          description: Valid Gregorian date between 1900 and 2200.
        type:
          type: string
          enum:
          - income
          - expense
          - 收入
          - 支出
        amount:
          type: string
          pattern: "^[0-9]{1,11}(\\.[0-9]{1,2})?$"
          description: Positive yuan, up to 10000000000.00; trimmed before validation.
        currency:
          type: string
          const: CNY
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          maxLength: 200
          description: Empty becomes 未分类.
        source:
          type: string
          minLength: 1
          maxLength: 200
        account:
          type: string
          maxLength: 200
          description: Empty becomes 待核实资金账户.
        externalId:
          type: string
          maxLength: 200
        note:
          type: string
          maxLength: 1000
    Transaction:
      type: object
      required:
      - id
      - date
      - type
      - amountMinor
      - currency
      - merchant
      - category
      - source
      - account
      - externalId
      - note
      - version
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        type:
          type: string
          enum:
          - income
          - expense
        amountMinor:
          "$ref": "#/components/schemas/Minor"
        currency:
          type: string
          const: CNY
        merchant:
          type: string
        category:
          type: string
        source:
          type: string
        account:
          type: string
          description: Currently a clearing account; does not imply a verified asset
            balance.
        externalId:
          type: string
        note:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    Dashboard:
      type: object
      required:
      - ledgerId
      - version
      - month
      - today
      - months
      - incomeMinor
      - expenseMinor
      - sourceCount
      - totalCount
      - filteredCount
      - page
      - pageSize
      - categories
      - transactions
      properties:
        ledgerId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        month:
          type: string
        today:
          type: string
          format: date
        months:
          type: array
          items:
            type: string
          description: Descending; includes selected month and current month.
        incomeMinor:
          "$ref": "#/components/schemas/Minor"
          description: Nonnegative monthly income in fen.
        expenseMinor:
          "$ref": "#/components/schemas/Minor"
          description: Nonnegative monthly expense in fen.
        sourceCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        filteredCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          const: 50
        categories:
          type: array
          description: Expense categories sorted by amount descending then name.
          items:
            type: object
            required:
            - name
            - amountMinor
            properties:
              name:
                type: string
              amountMinor:
                "$ref": "#/components/schemas/Minor"
                description: Positive expense total in fen.
        transactions:
          type: array
          maxItems: 50
          items:
            "$ref": "#/components/schemas/Transaction"
    CorrectionInput:
      type: object
      additionalProperties: false
      required: [version, type, amountMinor, reason]
      properties:
        version: {type: integer, format: int64, minimum: 1}
        type: {type: string, enum: [income, expense]}
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive amount magnitude in fen; the service applies the income/expense sign.
        reason: {type: string, minLength: 1, maxLength: 500}
    CorrectionPreview:
      type: object
      required: [before, after, incomeDeltaMinor, expenseDeltaMinor, netDeltaMinor]
      properties:
        before: {$ref: '#/components/schemas/Transaction'}
        after: {$ref: '#/components/schemas/Transaction'}
        incomeDeltaMinor: {$ref: '#/components/schemas/Minor'}
        expenseDeltaMinor: {$ref: '#/components/schemas/Minor'}
        netDeltaMinor: {$ref: '#/components/schemas/Minor'}
    CorrectionRevision:
      type: object
      required: [before, after, reason, createdAt]
      properties:
        before: {$ref: '#/components/schemas/Transaction'}
        after: {$ref: '#/components/schemas/Transaction'}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    AnnotationRevision:
      type: object
      required: [before, after, createdAt]
      properties:
        before: {$ref: '#/components/schemas/Transaction'}
        after: {$ref: '#/components/schemas/Transaction'}
        createdAt: {type: string, format: date-time}
    TransactionSource:
      type: object
      required: [importId, filename, line, disposition]
      properties:
        importId: {type: string}
        filename: {type: string}
        line: {type: integer}
        disposition: {type: string, enum: [added, duplicate]}
    ImportSummary:
      type: object
      required: [id, filename, parserVersion, createdAt, committedAt, result]
      properties:
        id: {type: string}
        filename: {type: string}
        parserVersion: {type: integer}
        errors: {type: integer, minimum: 0, default: 0}
        pending: {type: integer, minimum: 0, default: 0}
        createdAt: {type: string, format: date-time}
        committedAt: {type: [string, 'null'], format: date-time}
        result:
          oneOf:
          - type: 'null'
          - type: object
            required: [importId, added, skipped, month]
            properties:
              importId: {type: string}
              added: {type: integer, minimum: 0}
              skipped: {type: integer, minimum: 0}
              pending: {type: integer, minimum: 0, default: 0}
              month: {type: string}
    ImportPreview:
      type: object
      required:
      - id
      - filename
      - ledgerVersion
      - rows
      - newCount
      - duplicateCount
      - similarCount
      - errors
      - alreadyCommitted
      properties:
        format: {type: string, enum: [standard, alipay, wechat], default: standard}
        sourceAccount: {type: string}
        sourceDocument:
          type: object
          description: Private native source evidence including raw columns and original-byte fingerprint; never send to cloud models without redaction.
          additionalProperties: true
        pending:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [line, date, merchant, amount, reason]
            properties:
              line: {type: integer}
              date: {type: string}
              merchant: {type: string}
              amount: {type: string, description: Raw decimal value, may have invalid precision; not an integer-minor-unit amount.}
              reason: {type: string}
        id:
          type: string
          description: Stable batch UUID. Native parse failures are retained; standard CSV parse failures may have an empty ID.
        filename:
          type: string
        ledgerVersion:
          type: integer
          format: int64
          minimum: 0
        newCount:
          type: integer
          minimum: 0
          description: Includes similar records that require explicit confirmation.
        duplicateCount:
          type: integer
          minimum: 0
        similarCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string
        alreadyCommitted:
          type: boolean
        rows:
          type: array
          maxItems: 1000
          items:
            type: object
            required:
            - line
            - record
            - status
            - message
            properties:
              line:
                type: integer
                minimum: 2
                description: Physical CSV line where the record begins.
              record:
                "$ref": "#/components/schemas/Transaction"
              status:
                type: string
                enum:
                - new
                - duplicate
                - similar
                - conflict
              message:
                type: string
    AuthUser:
      type: object
      properties:
        provider:
          type: string
          enum:
          - google
          - github
        subject:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        allowed:
          type: boolean
        role:
          type: string
          enum:
          - ''
          - member
          - superadmin
        id:
          type: string
          description: Stable product account UUID; independent of the login provider.
      required:
      - provider
      - subject
      - username
      - email
      - displayName
      - allowed
      - role
      - id
    AuthState:
      type: object
      properties:
        user:
          oneOf:
          - "$ref": "#/components/schemas/AuthUser"
          - type: 'null'
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum:
                - google
                - github
              enabled:
                type: boolean
            required:
            - id
            - enabled
        csrfToken:
          type: string
          description: Proof for cookie-authenticated writes; empty when no valid
            session.
      required:
      - user
      - providers
      - csrfToken
    AccessSelector:
      type: object
      properties:
        provider:
          type: string
          enum:
          - google
          - github
        kind:
          type: string
          enum:
          - subject
          - username
          - email
        value:
          type: string
        note:
          type: string
          maxLength: 200
      required:
      - provider
      - kind
      - value
      additionalProperties: false
      description: GitHub supports numeric subject or username (resolved server-side
        at add time). Google supports subject or a trusted email invitation bound
        once on verified login. Role cannot be supplied.
    AccessEntry:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        kind:
          type: string
        value:
          type: string
        subject:
          type: string
          description: Empty while a Google email invitation awaits its first verified
            login.
        note:
          type: string
        role:
          type: string
          enum:
          - member
          - superadmin
        enabled:
          type: boolean
        protected:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - provider
      - kind
      - value
      - subject
      - note
      - role
      - enabled
      - protected
      - version
      - createdAt
    AccessAudit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
          enum:
          - add
          - bind
          - enable
          - disable
        entryId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - actor
      - action
      - entryId
      - createdAt
    LedgerInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - editor
          - viewer
        version:
          type: integer
      required:
      - id
      - name
      - role
      - version
      additionalProperties: false
    LedgerMember:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - editor
          - viewer
        version:
          type: integer
      required:
      - userId
      - name
      - role
      - version
      additionalProperties: false
    LedgerInvitation:
      type: object
      properties:
        id:
          type: string
        ledgerId:
          type: string
        ledgerName:
          type: string
        role:
          type: string
          enum:
          - editor
          - viewer
        invitedBy:
          type: string
      required:
      - id
      - ledgerId
      - ledgerName
      - role
      - invitedBy
      additionalProperties: false
    LinkedIdentity:
      type: object
      properties:
        provider:
          type: string
        subject:
          type: string
        username:
          type: string
        email:
          type: string
      required:
      - provider
      - subject
      - username
      - email
      additionalProperties: false
    PendingMerge:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        name:
          type: string
        username:
          type: string
      required:
      - id
      - provider
      - name
      - username
      additionalProperties: false
    RegisteredUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        role:
          type: string
          enum:
          - member
          - superadmin
        version:
          type: integer
      required:
      - id
      - name
      - enabled
      - role
      - version
      additionalProperties: false
